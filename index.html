<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CifraVerse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    header {
      background: #171a21;
      border-bottom: 1px solid #292d36;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #4ade80;
    }

    .hero {
      text-align: center;
      padding: 55px 10px 35px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aeb4c0;
      margin-bottom: 25px;
    }

    .search {
      display: flex;
      max-width: 650px;
      margin: auto;
    }

    .search input {
      flex: 1;
      padding: 16px;
      border: none;
      outline: none;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
    }

    .search button {
      padding: 16px 22px;
      border: none;
      background: #4ade80;
      color: #07110a;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
    }

    .card {
      background: #191d25;
      border: 1px solid #292d36;
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
    }

    .song {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid #292d36;
    }

    .song:last-child {
      border-bottom: none;
    }

    .nome {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #9da4b0;
      font-size: 14px;
      margin-top: 5px;
    }

    .tom {
      color: #4ade80;
      font-size: 13px;
      margin-top: 5px;
    }

    .button {
      background: #4ade80;
      color: #07110a;
      padding: 9px 13px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }

    .nenhum {
      color: #9da4b0;
      padding: 20px 0;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 50px 20px 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">🎵 CifraVerse</div>
  </div>
</header>

<main class="container">

  <section class="hero">

    <h1>Encontre sua cifra</h1>

    <p>
      Pesquise uma música ou artista e comece a tocar.
    </p>

    <form class="search" onsubmit="pesquisar(event)">

      <input
        id="campoBusca"
        type="search"
        placeholder="Qual música você quer tocar?"
        autocomplete="off"
      >

      <button type="submit">
        Buscar
      </button>

    </form>

  </section>

  <section class="card">

    <h2>Cifras populares</h2>

    <div id="resultado"></div>

  </section>

</main>

<footer>
  © 2026 CifraVerse — Seu espaço para aprender música.
</footer>

<script src="musicas.js"></script>

<script>

function mostrarMusicas(lista) {

  const resultado = document.getElementById("resultado");

  resultado.innerHTML = "";

  if (lista.length === 0) {

    resultado.innerHTML =
      '<div class="nenhum">😕 Nenhuma música encontrada.</div>';

    return;
  }

  lista.forEach(function(musica) {

    resultado.innerHTML += `

      <div class="song">

        <div>

          <div class="nome">
            ${musica.nome}
          </div>

          <div class="artist">
            ${musica.artista}
          </div>

          <div class="tom">
            Tom: ${musica.tom}
          </div>

        </div>

        <a
          href="cifra.html?musica=${encodeURIComponent(musica.nome)}"
          class="button"
        >
          Ver cifra
        </a>

      </div>

    `;

  });

}


function pesquisar(event) {

  event.preventDefault();

  const busca = document
    .getElementById("campoBusca")
    .value
    .toLowerCase()
    .trim();

  if (busca === "") {

    mostrarMusicas(musicas);

    return;
  }

  const resultados = musicas.filter(function(musica) {

    return (
      musica.nome.toLowerCase().includes(busca) ||
      musica.artista.toLowerCase().includes(busca)
    );

  });

  mostrarMusicas(resultados);

}


mostrarMusicas(musicas);

</script>

</body>
</html>
