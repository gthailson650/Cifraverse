<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CifraVerse — Cifras e músicas</title>

<meta name="description" content="CifraVerse — encontre cifras, acordes e músicas para tocar.">
<meta name="robots" content="index, follow">

<style>
:root{
  --bg:#0d0f12;
  --card:#15181d;
  --card2:#1c2026;
  --text:#f5f5f5;
  --muted:#9da4ad;
  --accent:#7c5cff;
  --accent2:#6244e8;
  --border:#2a2f37;
  --chord:#ffcc66;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(13,15,18,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:var(--accent);
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:12px 15px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  outline:none;
}

.search input:focus{
  border-color:var(--accent);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 60px;
}

.hero{
  padding:35px 0 25px;
}

.hero h1{
  margin:0 0 10px;
  font-size:38px;
}

.hero p{
  color:var(--muted);
  margin:0;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:25px 0 14px;
}

.section-title h2{
  margin:0;
}

.music-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.music-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  transition:.2s;
}

.music-card:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}

.music-card h3{
  margin:0 0 7px;
  font-size:20px;
}

.music-card p{
  color:var(--muted);
  margin:5px 0;
}

.key{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:7px;
  background:var(--card2);
  color:var(--chord);
  font-weight:bold;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:var(--accent);
  color:white;
  font-weight:bold;
}

.btn:hover{
  background:var(--accent2);
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--border);
}

.btn.danger{
  background:#b52b3c;
}

.viewer{
  display:none;
}

.viewer.active{
  display:block;
}

.home.hidden{
  display:none;
}

.song-header{
  padding:20px 0;
}

.song-header h1{
  margin:0 0 7px;
  font-size:34px;
}

.song-header p{
  color:var(--muted);
  margin:0;
}

.toolbar{
  position:sticky;
  top:64px;
  z-index:10;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
  margin-bottom:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
}

.toolbar button{
  padding:8px 11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
}

.toolbar button:hover{
  border-color:var(--accent);
}

.cifra{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  overflow:auto;
  font-family:"Courier New",monospace;
  font-size:18px;
  line-height:1.75;
  white-space:pre-wrap;
  min-height:300px;
}

.chord{
  color:var(--chord);
  font-weight:bold;
}

.admin{
  display:none;
}

.admin.active{
  display:block;
}

.admin-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-top:20px;
}

.admin-box h2{
  margin-top:0;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card2);
  color:var(--text);
  outline:none;
}

.form-group textarea{
  min-height:300px;
  resize:vertical;
  font-family:"Courier New",monospace;
}

.status{
  padding:12px;
  margin:12px 0;
  border-radius:9px;
  display:none;
}

.status.show{
  display:block;
  background:var(--card2);
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:12px;
}

.loading{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

footer{
  border-top:1px solid var(--border);
  margin-top:40px;
  padding:25px 18px;
  color:var(--muted);
  text-align:center;
}

.admin-link{
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
}

@media(max-width:650px){

  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  .hero h1{
    font-size:30px;
  }

  .song-header h1{
    font-size:28px;
  }

  .toolbar{
    top:103px;
  }

  .cifra{
    font-size:16px;
    padding:16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      Cifra<span>Verse</span>
    </div>

    <div class="search">
      <input
        id="campoBusca"
        type="search"
        placeholder="Buscar música ou artista..."
        oninput="pesquisar()"
      >
    </div>

  </div>
</header>

<main class="container">

  <!-- INÍCIO -->
  <section id="home" class="home">

    <div class="hero">
      <h1>Encontre sua música.</h1>
      <p>Cifras, acordes e músicas para você tocar.</p>
    </div>

    <div class="section-title">
      <h2>Músicas</h2>
    </div>

    <div id="listaMusicas" class="music-list">
      <div class="loading">Carregando músicas...</div>
    </div>

  </section>


  <!-- CIFRA -->
  <section id="viewer" class="viewer">

    <div class="song-header">
      <button class="btn secondary" onclick="voltarInicio()">
        ← Voltar
      </button>

      <h1 id="songTitle"></h1>
      <p id="songArtist"></p>
    </div>

    <div class="toolbar">

      <button onclick="transpor(-1)">
        − Tom
      </button>

      <button onclick="resetTom()">
        Tom original
      </button>

      <button onclick="transpor(1)">
        + Tom
      </button>

      <button onclick="alterarFonte(-1)">
        A−
      </button>

      <button onclick="alterarFonte(1)">
        A+
      </button>

      <button onclick="alternarAcordes()">
        Acordes
      </button>

      <button onclick="alternarRolagem()">
        Rolagem
      </button>

      <button onclick="alternarTema()">
        Tema
      </button>

    </div>

    <div id="cifraViewer" class="cifra"></div>

  </section>


  <!-- ADMIN -->
  <section id="admin" class="admin">

    <div class="admin-box">

      <button class="btn secondary" onclick="voltarInicio()">
        ← Voltar
      </button>

      <h2>Cadastrar música</h2>

      <p style="color:var(--muted)">
        Cadastre uma nova cifra no CifraVerse.
      </p>

      <div id="status" class="status"></div>

      <div class="form-group">
        <label for="nome">Nome da música</label>
        <input id="nome" placeholder="Ex.: Graça">
      </div>

      <div class="form-group">
        <label for="artista">Artista</label>
        <input id="artista" placeholder="Ex.: Gilmar Brito">
      </div>

      <div class="form-group">
        <label for="tom">Tom</label>
        <input id="tom" placeholder="Ex.: G">
      </div>

      <div class="form-group">
        <label for="cifra">Cifra / Letra</label>

        <textarea
          id="cifra"
          placeholder="Cole aqui a letra com os acordes.

Exemplo:

[G]Graça
        [C]maravilhosa
        [G]é o amor..."
        ></textarea>
      </div>

      <button class="btn" onclick="cadastrarMusica()">
        Cadastrar música
      </button>

    </div>

    <div class="admin-box">

      <h2>Músicas cadastradas</h2>

      <div id="adminLista">
        <div class="loading">Carregando...</div>
      </div>

    </div>

  </section>

</main>


<footer>

  <div>
    © 2026 CifraVerse
  </div>

  <br>

  <a
    href="?admin=1"
    class="admin-link"
  >
    Área administrativa
  </a>

</footer>


<script>

/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://jqnxnqxdsdutrwuvonnv.supabase.co";

/*
   COLE AQUI A SUA PUBLISHABLE KEY DO SUPABASE.

   NÃO coloque a Secret Key / service_role.
*/

const SUPABASE_KEY =
sb_publishable_W6w3YfaBDWjbTSQV8ZpFQA_vqigXS4Q


const API_URL =
SUPABASE_URL + "/rest/v1/musicas";


/* =========================================================
   ESTADO DO APLICATIVO
   ========================================================= */

let musicas = [];

let musicaAtual = null;

let tomOriginal = null;

let tomAtual = null;

let tamanhoFonte = 18;

let mostrarAcordes = true;

let intervaloRolagem = null;


/* =========================================================
   ACORDES
   ========================================================= */

const NOTAS = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];

const MAPA_BEMOL = {
  "Db":"C#",
  "Eb":"D#",
  "Gb":"F#",
  "Ab":"G#",
  "Bb":"A#"
};


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

document.addEventListener("DOMContentLoaded", function(){

  carregarMusicas();

  if(new URLSearchParams(location.search).get("admin") === "1"){
    abrirAdmin();
  }

});


/* =========================================================
   CARREGAR DO SUPABASE
   ========================================================= */

async function carregarMusicas(){

  const lista = document.getElementById("listaMusicas");

  lista.innerHTML =
    '<div class="loading">Carregando músicas...</div>';

  try{

    const resposta = await fetch(
      API_URL +
      "?select=id,created_at,nome,artista,tom,cifra&order=created_at.desc",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!resposta.ok){

      const erro = await resposta.text();

      throw new Error(erro);
    }

    const dados = await resposta.json();

    musicas = dados || [];

    mostrarMusicas(musicas);

    carregarAdminLista();

  }catch(erro){

    console.error(erro);

    lista.innerHTML = `
      <div class="empty">
        Não foi possível carregar as músicas.
        <br><br>
        Verifique a Publishable Key e a política SELECT do Supabase.
      </div>
    `;

  }

}


/* =========================================================
   MOSTRAR MÚSICAS
   ========================================================= */

function mostrarMusicas(lista){

  const elemento =
    document.getElementById("listaMusicas");

  if(!lista.length){

    elemento.innerHTML = `
      <div class="empty">
        Ainda não existem músicas cadastradas.
      </div>
    `;

    return;
  }

  elemento.innerHTML = lista.map(function(musica){

    return `
      <article class="music-card">

        <h3>${escapar(musica.nome || "Sem título")}</h3>

        <p>
          ${escapar(musica.artista || "Artista não informado")}
        </p>

        ${
          musica.tom
          ?
          `<span class="key">${escapar(musica.tom)}</span>`
          :
          ""
        }

        <br><br>

        <button
          class="btn"
          onclick="abrirMusica('${escaparJS(String(musica.id))}')"
        >
          Ver cifra
        </button>

      </article>
    `;

  }).join("");

}


/* =========================================================
   PESQUISA
   ========================================================= */

function pesquisar(){

  const termo =
    document
      .getElementById("campoBusca")
      .value
      .toLowerCase()
      .trim();

  if(!termo){

    mostrarMusicas(musicas);

    return;
  }

  const resultado =
    musicas.filter(function(musica){

      return (
        String(musica.nome || "")
          .toLowerCase()
          .includes(termo)
        ||
        String(musica.artista || "")
          .toLowerCase()
          .includes(termo)
      );

    });

  mostrarMusicas(resultado);

}


/* =========================================================
   ABRIR MÚSICA
   ========================================================= */

function abrirMusica(id){

  const musica =
    musicas.find(function(item){

      return String(item.id) === String(id);

    });

  if(!musica) return;

  musicaAtual = musica;

  tomOriginal = musica.tom || "C";

  tomAtual = tomOriginal;

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("admin")
    .classList.remove("active");

  document.getElementById("viewer")
    .classList.add("active");

  document.getElementById("songTitle")
    .textContent = musica.nome || "Sem título";

  document.getElementById("songArtist")
    .textContent = musica.artista || "";

  tamanhoFonte = 18;

  renderizarCifra();

  history.replaceState(
    null,
    "",
    "?musica=" + encodeURIComponent(musica.id)
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   RENDERIZAR CIFRA
   ========================================================= */

function renderizarCifra(){

  if(!musicaAtual) return;

  let texto =
    musicaAtual.cifra || "";

  texto =
    aplicarTransposicao(
      texto,
      tomOriginal,
      tomAtual
    );

  const elemento =
    document.getElementById("cifraViewer");

  elemento.style.fontSize =
    tamanhoFonte + "px";

  elemento.innerHTML =
    formatarCifra(texto);

}


/* =========================================================
   FORMATAR CIFRA
   ========================================================= */

function formatarCifra(texto){

  const linhas =
    texto.split("\n");

  return linhas.map(function(linha){

    if(!mostrarAcordes){

      linha =
        linha.replace(
          /\[([^\]]+)\]/g,
          ""
        );

      return escapar(linha);

    }

    let resultado =
      escapar(linha);

    resultado =
      resultado.replace(
        /\[([^\]]+)\]/g,
        '<span class="chord">[$1]</span>'
      );

    return resultado;

  }).join("\n");

}


/* =========================================================
   TRANSPOSIÇÃO
   ========================================================= */

function transpor(semitons){

  if(!musicaAtual) return;

  tomAtual =
    mudarTom(
      tomAtual,
      semitons
    );

  renderizarCifra();

}


function resetTom(){

  if(!musicaAtual) return;

  tomAtual = tomOriginal;

  renderizarCifra();

}


function mudarTom(tom, quantidade){

  if(!tom) return tom;

  const limpo =
    tom.trim();

  const encontrado =
    /^([A-Ga-g])([#b]?)/.exec(limpo);

  if(!encontrado){

    return tom;
  }

  let nota =
    encontrado[1].toUpperCase()
    +
    (encontrado[2] || "");

  nota =
    MAPA_BEMOL[nota] || nota;

  let indice =
    NOTAS.indexOf(nota);

  if(indice < 0){

    return tom;
  }

  indice =
    (indice + quantidade + 12) % 12;

  return NOTAS[indice];

}


function aplicarTransposicao(
  texto,
  origem,
  destino
){

  if(!origem || !destino) return texto;

  const notaOrigem =
    normalizarNota(origem);

  const notaDestino =
    normalizarNota(destino);

  const iOrigem =
    NOTAS.indexOf(notaOrigem);

  const iDestino =
    NOTAS.indexOf(notaDestino);

  if(
    iOrigem < 0 ||
    iDestino < 0
  ){

    return texto;
  }

  const diferenca =
    iDestino - iOrigem;

  return texto.replace(
    /\[([A-Ga-g](?:#|b)?(?:m|maj|min|dim|aug|sus|add)?[0-9]*(?:\/[A-Ga-g](?:#|b)?)?)\]/g,
    function(_, acorde){

      return "[" +
        transporAcorde(
          acorde,
          diferenca
        )
        +
        "]";

    }
  );

}


function normalizarNota(nota){

  const encontrada =
    /^([A-Ga-g])([#b]?)/.exec(
      nota || ""
    );

  if(!encontrada) return "";

  let resultado =
    encontrada[1].toUpperCase()
    +
    (encontrada[2] || "");

  return MAPA_BEMOL[resultado] || resultado;

}


function transporAcorde(
  acorde,
  quantidade
){

  const partes =
    acorde.split("/");

  const principal =
    transporParteAcorde(
      partes[0],
      quantidade
    );

  if(partes[1]){

    return principal +
      "/" +
      transporParteAcorde(
        partes[1],
        quantidade
      );

  }

  return principal;

}


function transporParteAcorde(
  acorde,
  quantidade
){

  const encontrado =
    /^([A-Ga-g])([#b]?)(.*)$/.exec(
      acorde
    );

  if(!encontrado){

    return acorde;
  }

  let nota =
    encontrado[1].toUpperCase()
    +
    (encontrado[2] || "");

  nota =
    MAPA_BEMOL[nota] || nota;

  let indice =
    NOTAS.indexOf(nota);

  if(indice < 0){

    return acorde;
  }

  indice =
    (indice + quantidade + 12) % 12;

  return (
    NOTAS[indice]
    +
    encontrado[3]
  );

}


/* =========================================================
   TAMANHO DA FONTE
   ========================================================= */

function alterarFonte(valor){

  tamanhoFonte += valor;

  if(tamanhoFonte < 12)
    tamanhoFonte = 12;

  if(tamanhoFonte > 32)
    tamanhoFonte = 32;

  renderizarCifra();

}


/* =========================================================
   MOSTRAR / OCULTAR ACORDES
   ========================================================= */

function alternarAcordes(){

  mostrarAcordes =
    !mostrarAcordes;

  renderizarCifra();

}


/* =========================================================
   ROLAGEM AUTOMÁTICA
   ========================================================= */

function alternarRolagem(){

  if(intervaloRolagem){

    clearInterval(intervaloRolagem);

    intervaloRolagem = null;

    return;
  }

  intervaloRolagem =
    setInterval(function(){

      window.scrollBy({
        top:1,
        left:0
      });

      if(
        window.innerHeight +
        window.scrollY
        >=
        document.body.offsetHeight - 10
      ){

        clearInterval(
          intervaloRolagem
        );

        intervaloRolagem = null;
      }

    },80);

}


/* =========================================================
   TEMA
   ========================================================= */

function alternarTema(){

  const atual =
    getComputedStyle(
      document.documentElement
    )
    .getPropertyValue("--bg")
    .trim();

  if(atual === "#ffffff"){

    document.documentElement.style
      .setProperty("--bg","#0d0f12");

    document.documentElement.style
      .setProperty("--card","#15181d");

    document.documentElement.style
      .setProperty("--card2","#1c2026");

    document.documentElement.style
      .setProperty("--text","#f5f5f5");

    document.documentElement.style
      .setProperty("--muted","#9da4ad");

    document.documentElement.style
      .setProperty("--border","#2a2f37");

  }else{

    document.documentElement.style
      .setProperty("--bg","#ffffff");

    document.documentElement.style
      .setProperty("--card","#f5f5f5");

    document.documentElement.style
      .setProperty("--card2","#eeeeee");

    document.documentElement.style
      .setProperty("--text","#151515");

    document.documentElement.style
      .setProperty("--muted","#666666");

    document.documentElement.style
      .setProperty("--border","#dddddd");

  }

}


/* =========================================================
   VOLTAR
   ========================================================= */

function voltarInicio(){

  document.getElementById("viewer")
    .classList.remove("active");

  document.getElementById("admin")
    .classList.remove("active");

  document.getElementById("home")
    .classList.remove("hidden");

  history.replaceState(
    null,
    "",
    location.pathname
  );

  document.getElementById("campoBusca")
    .value = "";

  mostrarMusicas(musicas);

}


/* =========================================================
   ADMIN
   ========================================================= */

function abrirAdmin(){

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("viewer")
    .classList.remove("active");

  document.getElementById("admin")
    .classList.add("active");

  carregarAdminLista();

}


async function cadastrarMusica(){

  const nome =
    document.getElementById("nome")
      .value.trim();

  const artista =
    document.getElementById("artista")
      .value.trim();

  const tom =
    document.getElementById("tom")
      .value.trim();

  const cifra =
    document.getElementById("cifra")
      .value.trim();

  if(!nome){

    mostrarStatus(
      "Digite o nome da música.",
      true
    );

    return;
  }

  if(!cifra){

    mostrarStatus(
      "Digite a cifra ou a letra.",
      true
    );

    return;
  }

  mostrarStatus(
    "Salvando música..."
  );

  try{

    const resposta =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=representation"
          },

          body:JSON.stringify({

            nome:nome,

            artista:artista || null,

            tom:tom || null,

            cifra:cifra

          })

        }
      );

    if(!resposta.ok){

      const erro =
        await resposta.text();

      throw new Error(erro);
    }

    mostrarStatus(
      "Música cadastrada com sucesso!"
    );

    document.getElementById("nome")
      .value = "";

    document.getElementById("artista")
      .value = "";

    document.getElementById("tom")
      .value = "";

    document.getElementById("cifra")
      .value = "";

    await carregarMusicas();

  }catch(erro){

    console.error(erro);

    mostrarStatus(
      "Erro ao cadastrar. Verifique a política INSERT do Supabase.",
      true
    );

  }

}


function mostrarStatus(
  mensagem,
  erro=false
){

  const elemento =
    document.getElementById("status");

  elemento.textContent =
    mensagem;

  elemento.classList.add("show");

}


/* =========================================================
   LISTA ADMIN
   ========================================================= */

function carregarAdminLista(){

  const elemento =
    document.getElementById("adminLista");

  if(!elemento) return;

  if(!musicas.length){

    elemento.innerHTML =
      '<div class="empty">Nenhuma música cadastrada.</div>';

    return;
  }

  elemento.innerHTML =
    musicas.map(function(musica){

      return `
        <div style="
          padding:14px 0;
          border-bottom:1px solid var(--border);
        ">

          <strong>
            ${escapar(musica.nome || "")}
          </strong>

          <div style="
            color:var(--muted);
            margin:5px 0 10px;
          ">
            ${escapar(musica.artista || "")}
          </div>

        </div>
      `;

    }).join("");

}


/* =========================================================
   SEGURANÇA BÁSICA DO HTML
   ========================================================= */

function escapar(texto){

  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escaparJS(texto){

  return String(texto)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}
