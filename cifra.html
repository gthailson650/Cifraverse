<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CifraVerse</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 20px;
    }

    .voltar {
      color: #4ade80;
      text-decoration: none;
    }

    .card {
      background: #191d25;
      border: 1px solid #292d36;
      border-radius: 14px;
      padding: 25px;
      margin-top: 25px;
    }

    .artista {
      color: #9da4b0;
      margin-bottom: 8px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .tom {
      color: #4ade80;
      font-weight: bold;
      font-size: 18px;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .verde {
      background: #4ade80;
      color: #07110a;
    }

    .escuro {
      background: #292d36;
      color: white;
    }

    #cifra {
      font-size: 20px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .acorde {
      color: #4ade80;
      font-weight: bold;
    }

    .erro {
      color: #ff8585;
      margin-top: 20px;
    }

  </style>

</head>


<body>


<div class="container">

  <a
    class="voltar"
    href="index.html"
  >
    ← Voltar para o início
  </a>


  <div class="card">

    <div
      class="artista"
      id="artista"
    >
      Carregando...
    </div>


    <h1 id="nomeMusica">
      Carregando...
    </h1>


    <div class="tom">

      Tom:
      <span id="tomAtual">
        -
      </span>

    </div>


    <div class="botoes">

      <button
        class="escuro"
        onclick="alterarTom(-1)"
      >
        − Baixar tom
      </button>


      <button
        class="verde"
        onclick="tomOriginal()"
      >
        Tom original
      </button>


      <button
        class="escuro"
        onclick="alterarTom(1)"
      >
        + Subir tom
      </button>


      <button
        class="escuro"
        onclick="alterarFonte(-2)"
      >
        A−
      </button>


      <button
        class="escuro"
        onclick="alterarFonte(2)"
      >
        A+
      </button>

    </div>


    <div id="cifra"></div>


    <div
      id="erro"
      class="erro"
    ></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const parametros =
  new URLSearchParams(
    window.location.search
  );


const nomeEscolhido =
  parametros.get("musica");


let musicaEncontrada = null;

let deslocamento = 0;

let tamanhoFonte = 20;


const acordes = [

  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"

];


const equivalentes = {

  "Db": "C#",
  "Eb": "D#",
  "Gb": "F#",
  "Ab": "G#",
  "Bb": "A#"

};


function separarAcorde(acorde) {

  if (!acorde) {

    return {
      nota: "",
      complemento: ""
    };

  }


  const resultado =
    acorde.match(
      /^([A-Ga-g])([#b]?)(.*)$/
    );


  if (!resultado) {

    return {
      nota: "",
      complemento: acorde
    };

  }


  let nota =
    resultado[1].toUpperCase() +
    resultado[2];


  const complemento =
    resultado[3];


  if (equivalentes[nota]) {

    nota =
      equivalentes[nota];

  }


  return {
    nota,
    complemento
  };

}


function mudarAcorde(acorde) {

  if (!acorde) {
    return "";
  }


  const partes =
    separarAcorde(acorde);


  let indice =
    acordes.indexOf(partes.nota);


  if (indice === -1) {

    return acorde;

  }


  indice += deslocamento;


  while (indice < 0) {

    indice += acordes.length;

  }


  indice =
    indice % acordes.length;


  return (
    acordes[indice] +
    partes.complemento
  );

}


async function carregarMusica() {

  const erro =
    document.getElementById("erro");


  if (!nomeEscolhido) {

    mostrarErro(
      "Nenhuma música foi escolhida."
    );

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("musicas")
      .select("*")
      .eq("nome", nomeEscolhido)
      .maybeSingle();


  if (error) {

    console.error(error);

    mostrarErro(
      "Erro ao buscar a música no banco."
    );

    return;

  }


  if (!data) {

    mostrarErro(
      "Música não encontrada no banco."
    );

    return;

  }


  musicaEncontrada = data;

  mostrarCifra();

}


function mostrarErro(mensagem) {

  document.getElementById(
    "nomeMusica"
  ).textContent =
    "Música não encontrada";


  document.getElementById(
    "artista"
  ).textContent = "";


  document.getElementById(
    "tomAtual"
  ).textContent = "-";


  document.getElementById(
    "cifra"
  ).innerHTML = "";


  document.getElementById(
    "erro"
  ).textContent = mensagem;

}


function mostrarCifra() {

  if (!musicaEncontrada) {
    return;
  }


  document.getElementById(
    "nomeMusica"
  ).textContent =
    musicaEncontrada.nome;


  document.getElementById(
    "artista"
  ).textContent =
    musicaEncontrada.artista || "";


  document.getElementById(
    "tomAtual"
  ).textContent =
    mudarAcorde(
      musicaEncontrada.tom || ""
    );


  const area =
    document.getElementById("cifra");


  area.innerHTML = "";


  let linhas =
    musicaEncontrada.linhas;


  if (typeof linhas === "string") {

    try {

      linhas =
        JSON.parse(linhas);

    } catch {

      linhas = [];

    }

  }


  if (!Array.isArray(linhas) || linhas.length === 0) {

    area.innerHTML =
      "<p>Cifra ainda não cadastrada.</p>";

    return;

  }


  linhas.forEach(function(linha) {

    let acorde = "";

    let texto = "";


    if (Array.isArray(linha)) {

      acorde =
        linha[0] || "";

      texto =
        linha[1] || "";

    } else {

      acorde =
        linha.acorde || "";

      texto =
        linha.texto || "";

    }


    const div =
      document.createElement("div");


    if (acorde) {

      const span =
        document.createElement("span");

      span.className =
        "acorde";

      span.textContent =
        "[" +
        mudarAcorde(acorde) +
        "]";


      div.appendChild(span);


      div.appendChild(
        document.createTextNode(
          " " + texto
        )
      );

    } else {

      div.textContent =
        texto;

    }


    area.appendChild(div);

  });


  area.style.fontSize =
    tamanhoFonte + "px";

}


function alterarTom(valor) {

  deslocamento += valor;

  mostrarCifra();

}


function tomOriginal() {

  deslocamento = 0;

  mostrarCifra();

}


function alterarFonte(valor) {

  tamanhoFonte += valor;


  if (tamanhoFonte < 14) {

    tamanhoFonte = 14;

  }


  if (tamanhoFonte > 34) {

    tamanhoFonte = 34;

  }


  mostrarCifra();

}


carregarMusica();

</script>


</body>

</html>
