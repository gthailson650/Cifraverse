<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cifra - CifraVerse</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 20px;
    }

    a {
      color: #4ade80;
      text-decoration: none;
    }

    .card {
      background: #191d25;
      border: 1px solid #292d36;
      border-radius: 14px;
      padding: 25px;
      margin-top: 25px;
    }

    .artista {
      color: #9da4b0;
    }

    .tom {
      color: #4ade80;
      font-weight: bold;
      font-size: 18px;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .verde {
      background: #4ade80;
      color: #07110a;
    }

    .escuro {
      background: #292d36;
      color: white;
    }

    #cifra {
      font-size: 20px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .acorde {
      color: #4ade80;
      font-weight: bold;
    }

    .controles {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html">← Voltar para o início</a>

  <div class="card">

    <div class="artista">
      Exemplo de artista
    </div>

    <h1>Minha Música</h1>

    <div class="tom">
      Tom: <span id="tomAtual">C</span>
    </div>

    <div class="botoes">

      <button class="escuro" onclick="alterarTom(-1)">
        − Baixar tom
      </button>

      <button class="verde" onclick="tomOriginal()">
        Tom original
      </button>

      <button class="escuro" onclick="alterarTom(1)">
        + Subir tom
      </button>

    </div>

    <div class="controles">

      <button class="escuro" onclick="alterarFonte(-2)">
        A−
      </button>

      <button class="escuro" onclick="alterarFonte(2)">
        A+
      </button>

    </div>

    <br>

    <div id="cifra"></div>

  </div>

</div>

<script>

const acordes = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];

let deslocamento = 0;
let tamanhoFonte = 20;

const musica = [
  ["C", "Esta é uma música"],
  ["G", "para testar o CifraVerse"],
  ["Am", "Aqui ficam os acordes"],
  ["F", "acima da música"],
  ["C", "Agora você pode mudar o tom"]
];

function separarAcorde(acorde) {

  let nota = acorde.substring(0, 1);

  if (
    acorde.length > 1 &&
    (acorde[1] === "#" || acorde[1] === "b")
  ) {
    nota = acorde.substring(0, 2);
  }

  let complemento = acorde.substring(nota.length);

  return {
    nota: nota,
    complemento: complemento
  };
}

function mudarAcorde(acorde) {

  const partes = separarAcorde(acorde);

  let nota = partes.nota;

  let indice = acordes.indexOf(nota);

  if (indice === -1) {
    return acorde;
  }

  indice = indice + deslocamento;

  while (indice < 0) {
    indice += acordes.length;
  }

  indice = indice % acordes.length;

  return acordes[indice] + partes.complemento;
}

function mostrarMusica() {

  const area = document.getElementById("cifra");

  area.innerHTML = "";

  musica.forEach(function(linha) {

    const acorde = mudarAcorde(linha[0]);

    const texto = linha[1];

    const div = document.createElement("div");

    div.innerHTML =
      '<span class="acorde">[' +
      acorde +
      ']</span> ' +
      texto;

    area.appendChild(div);

  });

  document.getElementById("tomAtual").textContent =
    mudarAcorde("C");

  area.style.fontSize = tamanhoFonte + "px";
}

function alterarTom(valor) {

  deslocamento += valor;

  mostrarMusica();

}

function tomOriginal() {

  deslocamento = 0;

  mostrarMusica();

}

function alterarFonte(valor) {

  tamanhoFonte += valor;

  if (tamanhoFonte < 14) {
    tamanhoFonte = 14;
  }

  if (tamanhoFonte > 32) {
    tamanhoFonte = 32;
  }

  mostrarMusica();

}

mostrarMusica();

</script>

</body>
</html>
