<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CifraVerse</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 20px;
    }

    .voltar {
      color: #4ade80;
      text-decoration: none;
    }

    .card {
      background: #191d25;
      border: 1px solid #292d36;
      border-radius: 14px;
      padding: 25px;
      margin-top: 25px;
    }

    .artista {
      color: #9da4b0;
      margin-bottom: 8px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .tom {
      color: #4ade80;
      font-weight: bold;
      font-size: 18px;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .verde {
      background: #4ade80;
      color: #07110a;
    }

    .escuro {
      background: #292d36;
      color: white;
    }

    #cifra {
      font-size: 20px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .acorde {
      color: #4ade80;
      font-weight: bold;
    }

    .erro {
      color: #ff8585;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="voltar" href="index.html">
    ← Voltar para o início
  </a>

  <div class="card">

    <div class="artista" id="artista">
      Carregando...
    </div>

    <h1 id="nomeMusica">
      Carregando...
    </h1>

    <div class="tom">
      Tom: <span id="tomAtual">-</span>
    </div>

    <div class="botoes">

      <button class="escuro" onclick="alterarTom(-1)">
        − Baixar tom
      </button>

      <button class="verde" onclick="tomOriginal()">
        Tom original
      </button>

      <button class="escuro" onclick="alterarTom(1)">
        + Subir tom
      </button>

      <button class="escuro" onclick="alterarFonte(-2)">
        A−
      </button>

      <button class="escuro" onclick="alterarFonte(2)">
        A+
      </button>

    </div>

    <div id="cifra"></div>

    <div id="erro" class="erro"></div>

  </div>

</div>

<script src="musicas.js"></script>
<script src="dados-cifras.js"></script>

<script>

const parametros =
  new URLSearchParams(window.location.search);

const nomeEscolhido =
  parametros.get("musica");

const musicaEncontrada =
  musicas.find(function(musica) {
    return musica.nome === nomeEscolhido;
  });

let deslocamento = 0;

let tamanhoFonte = 20;


const acordes = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


function separarAcorde(acorde) {

  let nota = acorde.substring(0, 1);

  if (
    acorde.length > 1 &&
    (acorde[1] === "#" || acorde[1] === "b")
  ) {
    nota = acorde.substring(0, 2);
  }

  let complemento =
    acorde.substring(nota.length);

  return {
    nota: nota,
    complemento: complemento
  };
}


function mudarAcorde(acorde) {

  const partes =
    separarAcorde(acorde);

  let indice =
    acordes.indexOf(partes.nota);

  if (indice === -1) {
    return acorde;
  }

  indice += deslocamento;

  while (indice < 0) {
    indice += acordes.length;
  }

  indice =
    indice % acordes.length;

  return (
    acordes[indice] +
    partes.complemento
  );
}


function mostrarCifra() {

  if (!musicaEncontrada) {

    document.getElementById("nomeMusica").textContent =
      "Música não encontrada";

    document.getElementById("artista").textContent =
      "";

    document.getElementById("tomAtual").textContent =
      "-";

    document.getElementById("erro").textContent =
      "Volte ao início e escolha uma música.";

    return;
  }


  const dados =
    dadosCifras[musicaEncontrada.nome];


  document.getElementById("nomeMusica").textContent =
    musicaEncontrada.nome;


  document.getElementById("artista").textContent =
    dados
      ? dados.artista
      : musicaEncontrada.artista;


  document.getElementById("tomAtual").textContent =
    dados
      ? mudarAcorde(dados.tom)
      : mudarAcorde(musicaEncontrada.tom);


  const area =
    document.getElementById("cifra");

  area.innerHTML = "";


  if (!dados || !dados.linhas) {

    area.innerHTML =
      "<p>Cifra ainda não cadastrada.</p>";

    return;
  }


  dados.linhas.forEach(function(linha) {

    const acorde =
      mudarAcorde(linha[0]);

    const texto =
      linha[1];

    const div =
      document.createElement("div");


    div.innerHTML =
      '<span class="acorde">[' +
      acorde +
      ']</span> ' +
      texto;


    area.appendChild(div);

  });


  area.style.fontSize =
    tamanhoFonte + "px";
}


function alterarTom(valor) {

  deslocamento += valor;

  mostrarCifra();
}


function tomOriginal() {

  deslocamento = 0;

  mostrarCifra();
}


function alterarFonte(valor) {

  tamanhoFonte += valor;


  if (tamanhoFonte < 14) {
    tamanhoFonte = 14;
  }


  if (tamanhoFonte > 34) {
    tamanhoFonte = 34;
  }


  mostrarCifra();
}


mostrarCifra();

</script>

</body>
</html>
