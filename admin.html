<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CifraVerse - Cadastro</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 20px;
    }

    h1 {
      color: #4ade80;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #292d36;
      background: #191d25;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
      font-family: monospace;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      background: #4ade80;
      color: #07110a;
      font-weight: bold;
      font-size: 16px;
      width: 100%;
    }

    .voltar {
      color: #4ade80;
      text-decoration: none;
    }

    .mensagem {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #191d25;
    }

    .exemplo {
      color: #9da4b0;
      margin-top: 10px;
      line-height: 1.6;
    }

  </style>

</head>


<body>


<div class="container">

  <a
    class="voltar"
    href="index.html"
  >
    ← Voltar para o CifraVerse
  </a>


  <h1>
    🎵 Cadastrar música
  </h1>


  <label>
    Nome da música
  </label>

  <input
    id="nome"
    placeholder="Ex: Bondade de Deus"
  >


  <label>
    Artista
  </label>

  <input
    id="artista"
    placeholder="Ex: Isaias Saad"
  >


  <label>
    Tom original
  </label>

  <input
    id="tom"
    placeholder="Ex: G"
  >


  <label>
    Cifra
  </label>

  <textarea
    id="conteudo"
    placeholder="[G] Eu vou cantar&#10;[Em] A bondade de Deus&#10;[C] Para sempre..."
  ></textarea>


  <div class="exemplo">

    Cada linha deve começar com o acorde entre colchetes.

    <br><br>

    Exemplo:

    <br>

    [G] Esta é uma música

    <br>

    [D] Salvando diretamente no banco

    <br>

    [Em] Pelo painel do CifraVerse

  </div>


  <button onclick="salvarMusica()">

    💾 Salvar música

  </button>


  <div
    id="mensagem"
    class="mensagem"
  ></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

function salvarMusica() {

  const nome =
    document
      .getElementById("nome")
      .value
      .trim();


  const artista =
    document
      .getElementById("artista")
      .value
      .trim();


  const tom =
    document
      .getElementById("tom")
      .value
      .trim();


  const conteudo =
    document
      .getElementById("conteudo")
      .value
      .trim();


  const mensagem =
    document.getElementById(
      "mensagem"
    );


  if (
    !nome ||
    !artista ||
    !tom ||
    !conteudo
  ) {

    mensagem.textContent =
      "❌ Preencha todos os campos.";

    return;

  }


  const linhasTexto =
    conteudo.split("\n");


  const linhas = [];


  linhasTexto.forEach(function(linha) {

    linha =
      linha.trim();


    if (!linha) {

      return;

    }


    const resultado =
      linha.match(
        /^\[([^\]]+)\]\s*(.*)$/
      );


    if (resultado) {

      linhas.push([

        resultado[1].trim(),

        resultado[2]

      ]);

    } else {

      linhas.push([

        "",

        linha

      ]);

    }

  });


  salvarNoSupabase(
    nome,
    artista,
    tom,
    linhas
  );

}


async function salvarNoSupabase(
  nome,
  artista,
  tom,
  linhas
) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );


  mensagem.textContent =
    "Salvando...";


  const { error } =
    await supabaseClient
      .from("musicas")
      .upsert(

        {
          nome: nome,
          artista: artista,
          tom: tom,
          linhas: linhas
        },

        {
          onConflict: "nome"
        }

      );


  if (error) {

    console.error(error);

    mensagem.textContent =
      "❌ Erro ao salvar: " +
      error.message;

    return;

  }


  mensagem.textContent =
    "🎵 Música salva com sucesso!";


  document.getElementById(
    "nome"
  ).value = "";


  document.getElementById(
    "artista"
  ).value = "";


  document.getElementById(
    "tom"
  ).value = "";


  document.getElementById(
    "conteudo"
  ).value = "";

}

</script>


</body>

</html>
