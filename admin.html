<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CifraVerse - Cadastro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 20px;
    }

    h1 {
      color: #4ade80;
    }

    .aviso {
      background: #191d25;
      border: 1px solid #292d36;
      padding: 15px;
      border-radius: 10px;
      color: #bbb;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #4ade80;
      color: #07110a;
      font-weight: bold;
      font-size: 16px;
    }

    .resultado {
      margin-top: 20px;
      background: #191d25;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      color: #4ade80;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 CifraVerse</h1>

  <h2>Cadastro de música</h2>

  <div class="aviso">
    Este painel gera os dados da música para você cadastrar no
    <strong>dados-cifras.js</strong>.
    <br><br>
    Use somente conteúdo que você tenha autorização para publicar.
  </div>

  <label for="nome">
    Nome da música
  </label>

  <input
    id="nome"
    type="text"
    placeholder="Ex: Minha Música"
  >

  <label for="artista">
    Artista
  </label>

  <input
    id="artista"
    type="text"
    placeholder="Ex: CifraVerse"
  >

  <label for="tom">
    Tom original
  </label>

  <select id="tom">
    <option>C</option>
    <option>C#</option>
    <option>D</option>
    <option>D#</option>
    <option>E</option>
    <option>F</option>
    <option>F#</option>
    <option>G</option>
    <option>G#</option>
    <option>A</option>
    <option>A#</option>
    <option>B</option>
    <option>Am</option>
    <option>Bm</option>
    <option>Dm</option>
    <option>Em</option>
    <option>Fm</option>
    <option>Gm</option>
  </select>

  <label for="conteudo">
    Conteúdo da cifra
  </label>

  <textarea
    id="conteudo"
    placeholder="Exemplo:

[C] Começamos aqui
[G] com nossa primeira cifra
[Am] Tudo pronto para tocar
[F] no CifraVerse"
  ></textarea>

  <button onclick="gerarCodigo()">
    Gerar código da música
  </button>

  <div
    id="resultado"
    class="resultado"
    style="display:none;"
  ></div>

  <a href="index.html" class="voltar">
    ← Voltar para o CifraVerse
  </a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

function gerarCodigo() {

  const nome =
    document.getElementById("nome").value.trim();

  const artista =
    document.getElementById("artista").value.trim();

  const tom =
    document.getElementById("tom").value;

  const conteudo =
    document.getElementById("conteudo").value.trim();


  if (!nome || !artista || !conteudo) {

    alert(
      "Preencha o nome, artista e conteúdo da cifra."
    );

    return;
  }


  const linhas =
    conteudo
      .split("\n")
      .filter(linha => linha.trim() !== "")
      .map(linha => {

        const correspondencia =
          linha.match(/^\[([^\]]+)\]\s*(.*)$/);

        if (correspondencia) {

          return [
            correspondencia[1],
            correspondencia[2]
          ];

        }

        return [
          "",
          linha
        ];

      });


  const codigo =
`  "${nome}": {
    artista: "${artista}",
    tom: "${tom}",
    linhas: ${JSON.stringify(linhas, null, 2)}
  }`;


  const resultado =
    document.getElementById("resultado");

  resultado.style.display = "block";

  resultado.textContent =
    codigo;

}

</script>

</body>
</html>
